name: Untrue CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: npm test
      - run: docker build -t untrue-ci .
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-baileys.js
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-stickers.js
      - name: Runtime dependency audit (report only)
        run: docker run --rm --entrypoint npm untrue-ci audit --omit=dev --json > npm-audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
