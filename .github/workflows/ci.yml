name: Untrue CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: npm test
      - run: docker build -t untrue-ci .
      - run: docker run --rm --entrypoint node untrue-ci --input-type=module -e "await import('./commands/commandHandler.js'); console.log('Comandos cargados')"
