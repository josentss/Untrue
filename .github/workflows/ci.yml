name: Untrue CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify
      - run: npm test
      - run: docker build -t untrue-ci .
      - name: Installed runtime dependency tree
        run: docker run --rm --entrypoint npm untrue-ci ls --omit=dev --all --json > runtime-dependencies.json
      - name: Docker image size
        run: docker image inspect untrue-ci --format '{{.Size}}' > docker-size-bytes.txt
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-baileys.js
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-stickers.js
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-music-downloads.js
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-social-downloads.js
      - run: docker run --rm --entrypoint node untrue-ci scripts/check-utilities.js
      - name: Runtime dependency audit (report only)
        run: |
          set +e
          docker run --rm --entrypoint npm untrue-ci audit --omit=dev --json > npm-audit.json 2> npm-audit-stderr.txt
          status=$?
          echo "$status" > npm-audit-exit-code.txt
          echo "npm audit exit code: $status (report only)"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: untrue-audit
          if-no-files-found: warn
          path: |
            npm-audit.json
            npm-audit-stderr.txt
            npm-audit-exit-code.txt
            runtime-dependencies.json
            docker-size-bytes.txt
