name: Prepare Baileys lockfile
on:
  push:
    branches: [modernization/baileys-v7]
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'josentss/Untrue' && github.ref == 'refs/heads/modernization/baileys-v7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve libsignal from npm rather than legacy git pin
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package-lock.json')); if(p.packages['node_modules/libsignal']?.resolved?.startsWith('git+')) { delete p.packages['node_modules/libsignal']; fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\\n'); }"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package-lock.json')); if(!p.packages['node_modules/libsignal']?.resolved?.startsWith('https://registry.npmjs.org/libsignal/')) process.exit(1);"
      - name: Publish generated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Generate npm lockfile for Baileys 7'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:refs/heads/modernization/baileys-v7
